			<use transform="translate( 32)" xlink:href="#hiris7"/>
			<use transform="translate( 60)" xlink:href="#hiris8"/>
			<use transform="translate( 88)" xlink:href="#hiris9"/>
			<use transform="translate(116)" xlink:href="#hiris10"/>
